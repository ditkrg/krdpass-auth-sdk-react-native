buildscript {
  // Only used when this library is opened directly. App builds provide their
  // own AGP/Kotlin versions through the React Native Gradle plugin.
  if (project == rootProject) {
    repositories {
      google()
      mavenCentral()
    }
    dependencies {
      classpath("com.android.tools.build:gradle:8.9.2")
      classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.10")
    }
  }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'com.facebook.react'

group = 'krdpass.auth.reactnative'
version = '1.2.0'

def safeExtGet = { prop, fallback ->
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "krdpass.auth.reactnative"
  compileSdkVersion safeExtGet("compileSdkVersion", 36)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
    versionCode 1
    versionName "1.2.0"
  }
  lintOptions {
    abortOnError false
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "krd.pass:krdpass-auth:1.1.1"
  // Used by the bridge's bounded in-flight authentication work.
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
}
