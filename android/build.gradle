apply plugin: 'com.android.library'

group = 'krdpass.auth.reactnative'
version = '1.0.1'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 24)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
  }
}

android {
  namespace "krdpass.auth.reactnative"
  defaultConfig {
    versionCode 1
    versionName "1.0.1"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // For local development against a sibling checkout, include the library project in your
  // app's settings.gradle, e.g. include(":krdpass-auth-sdk-android:library") with
  // project(":krdpass-auth-sdk-android:library").projectDir pointed at ../krdpass-auth-sdk-android/library.
  def localKrdpassAndroid = findProject(":krdpass-auth-sdk-android:library")
  if (localKrdpassAndroid != null) {
    implementation localKrdpassAndroid
  } else {
    implementation "krd.pass:krdpass-auth:1.0.1"
  }
  // coroutines-core is used (module.scope.launch).
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  implementation "androidx.activity:activity:1.9.3"
}
