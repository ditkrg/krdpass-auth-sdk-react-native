// No buildscript block. This directory ships no settings.gradle and no Gradle wrapper, so
// it can never be a root project, and the AGP/Kotlin classpath declared here would never be
// applied. The consuming app supplies both through the React Native Gradle plugin, which is
// also what decides the Kotlin version this module is compiled with.

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'com.facebook.react'

group = 'krdpass.auth.reactnative'
version = '1.4.0'

def safeExtGet = { prop, fallback ->
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace = "krdpass.auth.reactnative"
  compileSdk = safeExtGet("compileSdkVersion", 36)
  defaultConfig {
    minSdk = safeExtGet("minSdkVersion", 24)
    targetSdk = safeExtGet("targetSdkVersion", 36)
    versionCode = 1
    versionName = "1.4.0"
  }
  lint {
    abortOnError = false
  }
  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "krd.pass:krdpass-auth:1.4.0"
  // Used by the bridge's bounded in-flight authentication work.
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
}
