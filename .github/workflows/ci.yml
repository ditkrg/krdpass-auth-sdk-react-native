name: CI

# Build + test only. No publish step (packages are not published yet).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.13.0'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  consumer-verify:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Bare React Native 0.86 (Android)
            consumer: bare
            platform: android
            runner: ubuntu-24.04
          - label: Expo SDK 57 (Android)
            consumer: expo
            platform: android
            runner: ubuntu-24.04
          - label: Bare React Native 0.86 (iOS)
            consumer: bare
            platform: ios
            runner: macos-26
          - label: Expo SDK 57 (iOS)
            consumer: expo
            platform: ios
            runner: macos-26
          - label: Bare React Native 0.81.6 legacy architecture (Android)
            consumer: bare
            platform: android
            runner: ubuntu-24.04
            react_native_version: 0.81.6
            cli_version: 19.1.2
            architecture: legacy
          - label: Bare React Native 0.81.6 New Architecture (Android)
            consumer: bare
            platform: android
            runner: ubuntu-24.04
            react_native_version: 0.81.6
            cli_version: 19.1.2
            architecture: new
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.13.0'
          cache: 'npm'
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run build
      - name: Report the iOS runner toolchain
        if: matrix.platform == 'ios'
        run: |
          xcodebuild -version
          swift --version
      - name: Build the packed SDK in a clean ${{ matrix.consumer }} consumer
        env:
          CONSUMER: ${{ matrix.consumer }}
          PLATFORM: ${{ matrix.platform }}
          BARE_REACT_NATIVE_VERSION: ${{ matrix.react_native_version }}
          REACT_NATIVE_CLI_VERSION: ${{ matrix.cli_version }}
          BARE_ARCHITECTURE: ${{ matrix.architecture }}
        run: node scripts/verify-consumer.mjs --kind "$CONSUMER" --platform "$PLATFORM"
