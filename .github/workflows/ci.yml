name: CI

# Build + test only. Consumers install via an npm git dependency; there is no publish step.
on:
  push:
    branches: [main]
  # Any target branch: the maintainer convention is to open PRs against dev, and a
  # main-only filter means those PRs never run a build or a test.
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  android-unit-tests:
    name: Android unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: 'npm'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run build
      # android/ ships no settings.gradle or wrapper, so a generated consumer is where the
      # module has a complete Gradle setup to run its own JVM tests in.
      - run: node scripts/verify-consumer.mjs --unit-tests

  consumer-verify:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    environment: native-consumer-${{ matrix.platform }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Bare React Native 0.86 (Android)
            consumer: bare
            platform: android
            runner: ubuntu-24.04
          - label: Expo SDK 57 (Android)
            consumer: expo
            platform: android
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: 'npm'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run build
      - name: Build the packed SDK in a clean ${{ matrix.consumer }} consumer
        env:
          CONSUMER: ${{ matrix.consumer }}
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/verify-consumer.mjs --kind "$CONSUMER" --platform "$PLATFORM"

  consumer-verify-ios:
    name: ${{ matrix.label }}
    # The iOS legs need a real macOS runner and a deploy key for the private iOS core repo,
    # which forked and Dependabot PRs never get. Skip the job outright instead of spinning up
    # a paid macOS runner just to report a toolchain version and do nothing.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ${{ matrix.runner }}
    environment: native-consumer-ios
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Bare React Native 0.86 (iOS)
            consumer: bare
            runner: macos-26
          - label: Expo SDK 57 (iOS)
            consumer: expo
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Configure read-only Git access to the iOS core repository
        shell: bash
        env:
          KRDPASS_IOS_DEPLOY_KEY: ${{ secrets.KRDPASS_IOS_DEPLOY_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$KRDPASS_IOS_DEPLOY_KEY"
          ssh_dir="$RUNNER_TEMP/krdpass-ios-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$KRDPASS_IOS_DEPLOY_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/meta |
            jq -r '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
          git config --global core.sshCommand \
            "ssh -i $ssh_dir/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"
          git config --global \
            url."git@github.com:ditkrg/krdpass-auth-sdk-ios.git".insteadOf \
            "https://github.com/ditkrg/krdpass-auth-sdk-ios.git"
      - name: Report the iOS runner toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build the packed SDK in a clean ${{ matrix.consumer }} consumer
        env:
          CONSUMER: ${{ matrix.consumer }}
          PLATFORM: ios
        run: node scripts/verify-consumer.mjs --kind "$CONSUMER" --platform "$PLATFORM"
