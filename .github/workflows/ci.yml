name: CI

# Build + test only. Consumers install via an npm git dependency; there is no publish step.
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  android-unit-tests:
    name: Android unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: 'npm'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run build
      # android/ ships no settings.gradle or wrapper, so a generated consumer is where the
      # module has a complete Gradle setup to run its own JVM tests in.
      - run: node scripts/verify-consumer.mjs --unit-tests

  consumer-verify:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    environment: native-consumer-${{ matrix.platform }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Bare React Native 0.86 (Android)
            consumer: bare
            platform: android
            runner: ubuntu-24.04
          - label: Expo SDK 57 (Android)
            consumer: expo
            platform: android
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: 'npm'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run build
      - name: Build the packed SDK in a clean ${{ matrix.consumer }} consumer
        env:
          CONSUMER: ${{ matrix.consumer }}
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/verify-consumer.mjs --kind "$CONSUMER" --platform "$PLATFORM"

  consumer-verify-ios:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Bare React Native 0.86 (iOS)
            consumer: bare
            runner: macos-26
          - label: Expo SDK 57 (iOS)
            consumer: expo
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Report the iOS runner toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build the packed SDK in a clean ${{ matrix.consumer }} consumer
        env:
          CONSUMER: ${{ matrix.consumer }}
          PLATFORM: ios
        run: node scripts/verify-consumer.mjs --kind "$CONSUMER" --platform "$PLATFORM"
