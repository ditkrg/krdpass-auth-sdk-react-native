name: CI

# Build + test only. No publish step (packages are not published yet).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # `npm install` (not `npm ci`) so the build tolerates a lockfile generated by a
      # different npm major than the runner's. Switch to `npm ci` once node/npm are
      # standardized (e.g. for the publish workflow).
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
