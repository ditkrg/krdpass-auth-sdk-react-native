name: Release

# Tagging vX.Y.Z creates a GitHub Release. Consumers install via an npm git dependency.
on:
  push:
    tags: ['v*']

# Least privilege: the default token is read-only; only the release job elevates.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-package:
    name: Verify package and tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify that the tag exactly matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const tag = process.env.TAG;
          const version = require('./package.json').version;
          if (tag !== `v${version}`) {
            throw new Error(`Tag ${tag} does not match package version ${version}.`);
          }
          NODE
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  consumer-verify:
    name: ${{ matrix.label }}
    needs: verify-package
    runs-on: ${{ matrix.runner }}
    environment: native-consumer-${{ matrix.platform }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Bare React Native 0.86 (Android)
            consumer: bare
            platform: android
            runner: ubuntu-24.04
          - label: Expo SDK 57 (Android)
            consumer: expo
            platform: android
            runner: ubuntu-24.04
          - label: Bare React Native 0.86 (iOS)
            consumer: bare
            platform: ios
            runner: macos-26
          - label: Expo SDK 57 (iOS)
            consumer: expo
            platform: ios
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run build
      - name: Configure read-only Git access to the iOS core repository
        if: matrix.platform == 'ios'
        shell: bash
        env:
          KRDPASS_IOS_DEPLOY_KEY: ${{ secrets.KRDPASS_IOS_DEPLOY_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$KRDPASS_IOS_DEPLOY_KEY"
          ssh_dir="$RUNNER_TEMP/krdpass-ios-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$KRDPASS_IOS_DEPLOY_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/meta |
            jq -r '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
          git config --global core.sshCommand \
            "ssh -i $ssh_dir/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"
          git config --global \
            url."git@github.com:ditkrg/krdpass-auth-sdk-ios.git".insteadOf \
            "https://github.com/ditkrg/krdpass-auth-sdk-ios.git"
      - name: Report the iOS runner toolchain
        if: matrix.platform == 'ios'
        run: |
          xcodebuild -version
          swift --version
      - name: Build the packed SDK in a clean ${{ matrix.consumer }} consumer
        env:
          CONSUMER: ${{ matrix.consumer }}
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/verify-consumer.mjs --kind "$CONSUMER" --platform "$PLATFORM"

  release:
    name: Release
    needs: [verify-package, consumer-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
