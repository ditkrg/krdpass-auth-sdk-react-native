# Keeps npm (JS) + Gradle (Android native) dependencies monitored for security
# advisories. The shipped JS package has no runtime deps; this mainly watches the
# Android native module deps and the dev toolchain.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # expo-module-scripts currently depends on ts-jest 29, whose published
    # peer range is TypeScript <7 and whose Expo test stack remains on Jest 29.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      - dependency-name: "jest"
        versions: [">=30.0.0"]
      - dependency-name: "@types/jest"
        versions: [">=30.0.0"]
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
